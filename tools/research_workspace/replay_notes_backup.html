<!doctype html>
<meta charset="utf-8">
<title>Back up replay notes</title>
<style>body{font:18px system-ui;max-width:850px;margin:50px auto;padding:20px}button{font:inherit;padding:12px;margin:8px 8px 8px 0}pre{white-space:pre-wrap}</style>
<h1>Back up your replay notes</h1>
<p>This page reads the saved notes in this browser. It never edits or removes them.</p>
<p id="status" role="status">Reading saved notes…</p>
<button id="download" disabled>Download backup</button>
<button id="transfer" disabled>Copy notes to the research workspace</button>
<pre id="details"></pre>
<p>Keep your original review tab open. Download a backup first, then copy the notes to the workspace.</p>
<script>
const selected = __SELECTED_DIGESTS__;
const prefix = 'mtgallium.replay-review-situation-note.v1.';
const status = document.getElementById('status');
const details = document.getElementById('details');
const download = document.getElementById('download');
const transfer = document.getElementById('transfer');
const entries = [];
const notes = [];
const errors = [];
try {
  for (let index = 0; index < localStorage.length; index++) {
    const key = localStorage.key(index);
    if (!key || !key.startsWith(prefix)) continue;
    const raw = localStorage.getItem(key);
    entries.push({key, raw}); // Preserve original strings, including unparseable records.
    try {
      const note = JSON.parse(raw);
      if (selected.includes(note.source?.safeBundleSha256) && typeof note.thoughts === 'string' && note.thoughts.trim()) notes.push(note);
    } catch { errors.push(key); }
  }
  status.textContent = `Found ${notes.length} nonempty notes for these games. The backup includes all ${entries.length} saved frame-note records.`;
  details.textContent = selected.map(digest => `${notes.filter(n => n.source.safeBundleSha256 === digest).length} notes · game ${selected.indexOf(digest) + 1}`).join('\n');
  if (errors.length) details.textContent += `\n${errors.length} unreadable records will be preserved in the backup.`;
  download.disabled = entries.length === 0;
} catch (error) {
  status.textContent = `Browser storage could not be read: ${error.message}. Keep the original tab open.`;
}
download.onclick = () => {
  const blob = new Blob([JSON.stringify({documentKind: 'replay-note-browser-backup-v1', exportedAtUtc: new Date().toISOString(), entries}, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'mtgallium-replay-notes-backup.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  transfer.disabled = notes.length === 0;
  status.textContent = 'Backup download requested. Check that the file is saved, then copy notes to the workspace.';
};
transfer.onclick = async () => {
  transfer.disabled = true;
  let copied = 0;
  const failed = [];
  for (const note of notes) {
    try {
      const response = await fetch('/api/replay-review-notes', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(note)});
      if (!response.ok) throw new Error(await response.text());
      const saved = await response.json();
      if (JSON.stringify(saved.note) !== JSON.stringify(note)) throw new Error('Saved copy differs');
      copied++;
    } catch (error) { failed.push(`Frame ${note.source.frameIndex}: ${error.message}`); }
    status.textContent = `Copied ${copied} of ${notes.length} notes. Browser originals remain intact.`;
  }
  if (failed.length) { details.textContent += '\n' + failed.join('\n'); transfer.disabled = false; }
  else status.textContent = `All ${copied} notes copied to the research workspace. Browser originals remain intact.`;
};
</script>
