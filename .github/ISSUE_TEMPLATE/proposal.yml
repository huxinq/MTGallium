name: Bounded proposal
description: Propose a bounded technical change with explicit semantics.
body:
  - type: textarea
    attributes:
      label: Scope and question
      description: State the problem, desired behavior, and any semantic choice that needs resolving.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Verification
      description: State the checks that would distinguish success and any material limits.
    validations:
      required: true
