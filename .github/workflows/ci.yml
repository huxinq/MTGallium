name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # Only pushes to main publish shared caches; all other runs may restore them.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Install tooling prerequisites
        run: sudo apt-get update && sudo apt-get install -y just nodejs npm
      - name: Install durable runner dependencies
        run: npm ci --prefix tools/durable-run --ignore-scripts
      - name: Public-source check
        run: just check "$RUNNER_TEMP/mtgallium-private-evidence"
