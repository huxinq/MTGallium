name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/setup-java@99e7c7c6a3e5529b1b146b9e9a6a12a9c41c739d
        with:
          distribution: temurin
          java-version: '21'
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Public-source check
        run: just check "$RUNNER_TEMP/mtgallium-private-evidence"
